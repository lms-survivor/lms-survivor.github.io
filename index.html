<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Last Man Standing – Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <h1>Last Man Standing</h1>
        <p>THE WORLD'S GREATEST FOOTBALL POOL!</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Welcome back</h2>
      <p class="muted">Enter the email + PIN from your invite.</p>
      <form id="loginForm" autocomplete="off">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required />

        <label for="pin">PIN</label>
        <input class="input" id="pin" name="pin" type="password" inputmode="numeric" required />

        <div class="actions">
          <button class="btn secondary" type="button" onclick="window.location.href='inquiry.html'">Request Access</button>
          <button class="btn primary" type="submit">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 optimAIze plus LLC. All Rights Reserved.</p>
    <img src="logo.png" alt="Logo">
  </footer>

  <!-- Your existing logic -->
  <script defer src="script.js"></script>
  <!-- UI helpers (overlay + toasts) -->
  <script defer src="ui.js"></script>

  <div id="overlay"></div>
  <div id="loading">
    <div class="box">
      <div class="spinner"></div>
      <div class="loader-text">Loading…</div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      if (window.UI) UI.showLoader('Signing you in…');
      try { handleLogin(e); } finally {
        // Hide the loader after a small delay to allow handleLogin to finish/hide itself
        setTimeout(() => { if (window.UI) UI.hideLoader(); }, 1000);
      }
    });
  </script>
</body>
</html>
