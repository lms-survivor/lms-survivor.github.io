<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Last Man Standing – Registration</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <h1>Last Man Standing</h1>
        <p>THE WORLD'S GREATEST FOOTBALL POOL!</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Request Access</h2>
      <form id="registrationForm" autocomplete="off">
        <div class="row">
          <div class="col">
            <label for="first_name">First name</label>
            <input class="input" id="first_name" name="first_name" required>
          </div>
          <div class="col">
            <label for="last_name">Last name</label>
            <input class="input" id="last_name" name="last_name" required>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label for="phone">Phone</label>
            <input class="input" id="phone" name="phone" inputmode="tel">
          </div>
          <div class="col">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" required>
          </div>
        </div>

        <label for="entries">Number of entries</label>
        <input class="input" id="entries" name="entries" type="number" min="1" max="20" value="1" required>

        <label for="reason">Notes (optional)</label>
        <textarea class="input" id="reason" name="reason" rows="3"></textarea>

        <div class="actions">
          <button class="btn secondary" type="button" onclick="window.location.href='index.html'">Back</button>
          <button class="btn primary" type="submit">Submit Request</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 optimAIze plus LLC. All Rights Reserved.</p>
    <img src="logo.png" alt="Logo">
  </footer>

  <script defer src="script.js"></script>
  <script defer src="ui.js"></script>

  <div id="overlay"></div>
  <div id="loading">
    <div class="box">
      <div class="spinner"></div>
      <div class="loader-text">Submitting…</div>
    </div>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', (e)=>{
      if (window.UI) UI.showLoader('Submitting your request…');
      try { handleRegistration(e); } finally {
        setTimeout(()=>{ if (window.UI) UI.hideLoader(); }, 1000);
      }
    });
  </script>
</body>
</html>
